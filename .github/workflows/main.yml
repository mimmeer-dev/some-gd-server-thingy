name: Get GD News
run-name: Downloading Geometry Dash News
on:
  schedule:
    - cron: '0 0 * * 1-6'
  push:
jobs:
  get-news:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch news file
        uses: foxtrotperry/fetch-file-action@v0
        with:
          url: 'https://geometrydashfiles.b-cdn.net/news/news.dat'
          path: 'toupload/'
          filename: 'news.dat'
      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: toupload
  deploy:
    needs: get-news
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
